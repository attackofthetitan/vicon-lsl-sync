name: Build Vicon LSL Bridge

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vicon-lsl-bridge/**"
      - "labrecorder/**"
      - "hololens-gaze-lsl/**"
      - "stream-contracts/**"
      - "tools/generate_stream_contracts.py"
      - ".github/workflows/build-bridge.yml"
      - ".github/scripts/**"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "vicon-lsl-bridge/**"
      - "labrecorder/**"
      - "hololens-gaze-lsl/**"
      - "stream-contracts/**"
      - "tools/generate_stream_contracts.py"
      - ".github/workflows/build-bridge.yml"
      - ".github/scripts/**"

jobs:
  logic-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        fetch_catch2: [ON, OFF]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify generated stream contracts
        run: python tools/generate_stream_contracts.py --check

      - name: Configure dependency-light tests
        run: cmake -S vicon-lsl-bridge -B build-logic -DVICON_LSL_BRIDGE_BUILD_RUNTIME=OFF -DVICON_LSL_BRIDGE_BUILD_GUI=OFF -DVICON_LSL_BRIDGE_FETCH_CATCH2=${{ matrix.fetch_catch2 }} -DBUILD_TESTING=ON

      - name: Build dependency-light tests
        run: cmake --build build-logic --config Release --target vicon-lsl-bridge-logic-tests

      - name: Run dependency-light tests
        run: ctest --test-dir build-logic --build-config Release --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: vicon-lsl-bridge-linux-x64
          - os: windows-latest
            triplet: x64-windows-static-md
            artifact: vicon-lsl-bridge-windows-x64
          - os: macos-latest
            artifact: vicon-lsl-bridge-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Test packaging safety helpers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vicon-lsl-bridge\packaging\windows\tests\PackagingSafety.Tests.ps1"

      - name: Install Qt6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.3'
          cache: true

      - name: Prepare pinned Qt source licenses (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\prepare-qt-licenses.ps1" `
            -Workspace $env:GITHUB_WORKSPACE -TempDirectory $env:RUNNER_TEMP

      - name: Install Boost (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0

      - name: Install Boost (macOS)
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Bootstrap pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\bootstrap-vcpkg.ps1" `
            -TempDirectory $env:RUNNER_TEMP -EnvironmentFile $env:GITHUB_ENV

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-d87340acc46bdeda386037b38aca30136e667e47-${{ matrix.triplet }}-boost-${{ hashFiles('vicon-lsl-bridge/CMakeLists.txt', 'vicon-lsl-bridge/external/vicon-datastream-sdk/CMakeLists.txt', 'labrecorder/CMakeLists.txt', '**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-d87340acc46bdeda386037b38aca30136e667e47-${{ matrix.triplet }}-boost-

      - name: Install Boost via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install boost-thread:${{ matrix.triplet }} boost-chrono:${{ matrix.triplet }} boost-asio:${{ matrix.triplet }} boost-filesystem:${{ matrix.triplet }} boost-format:${{ matrix.triplet }} boost-algorithm:${{ matrix.triplet }} boost-date-time:${{ matrix.triplet }} boost-math:${{ matrix.triplet }} boost-range:${{ matrix.triplet }} boost-lexical-cast:${{ matrix.triplet }}
          if ($LASTEXITCODE -ne 0) { throw "Pinned vcpkg dependency install failed with exit code $LASTEXITCODE" }

      # Build vicon-lsl-bridge (CLI + GUI)
      - name: Configure bridge (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DBUILD_TESTING=ON
        working-directory: vicon-lsl-bridge

      - name: Configure bridge (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DBUILD_TESTING=ON
        working-directory: vicon-lsl-bridge

      - name: Configure bridge (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVICON_LSL_LABRECORDER_DEPLOY_DIR=${{ github.workspace }}/recorder-deploy "-DVICON_LSL_QT_LICENSE_ROOT=${{ github.workspace }}/qt-license-source" -DBUILD_TESTING=ON
        working-directory: vicon-lsl-bridge
        shell: cmd

      - name: Build bridge
        run: cmake --build build --config Release
        working-directory: vicon-lsl-bridge

      - name: Test bridge
        run: ctest --test-dir build --build-config Release --output-on-failure
        working-directory: vicon-lsl-bridge

      # Build LabRecorder
      - name: Configure LabRecorder
        run: cmake -S labrecorder -B build-labrecorder -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_LSL=ON -DLSL_FETCH_IF_MISSING=ON -DLSL_FETCH_REF=03316f61137485450e7a43aea972c8e55b0c796a

      - name: Build LabRecorder
        run: cmake --build build-labrecorder --config Release --parallel

      - name: Install and deploy LabRecorder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\deploy-labrecorder.ps1" `
            -Workspace $env:GITHUB_WORKSPACE

      - name: Verify packaged executable inventory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = @(
            'vicon-lsl-bridge\build\Release\vicon-lsl-bridge.exe',
            'vicon-lsl-bridge\build\Release\vicon-lsl-bridge-gui.exe',
            'recorder-deploy\LabRecorder.exe',
            'recorder-deploy\LabRecorderCLI.exe')
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Expected packaged executable is missing: $path" }
          }

      # Package everything together
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: bash .github/scripts/package-linux.sh "${{ matrix.artifact }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash .github/scripts/package-macos.sh "${{ matrix.artifact }}"

      - name: Test package (macOS)
        if: runner.os == 'macOS'
        run: bash .github/scripts/test-package-macos.sh "${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\package-windows.ps1" `
            -Workspace $env:GITHUB_WORKSPACE -ArtifactName "${{ matrix.artifact }}"

      - name: Test missing-license failure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\test-missing-license.ps1" `
            -Workspace $env:GITHUB_WORKSPACE -RunnerTemp $env:RUNNER_TEMP `
            -VcpkgInstallationRoot $env:VCPKG_INSTALLATION_ROOT `
            -Triplet "${{ matrix.triplet }}"

      - name: Verify portable executable inventory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = "${{ matrix.artifact }}-gui-portable.exe"
          if (-not (Test-Path $portable)) { throw "Portable executable is missing: $portable" }

      - name: Test portable GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\test-portable-gui.ps1" `
            -ArtifactName "${{ matrix.artifact }}"

      - name: Test verified portable extraction (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\test-portable-extraction.ps1" `
            -ArtifactName "${{ matrix.artifact }}" -RunnerTemp $env:RUNNER_TEMP

      - name: Reject tampered portable payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\test-portable-tamper.ps1" `
            -ArtifactName "${{ matrix.artifact }}" -RunnerTemp $env:RUNNER_TEMP

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*
            ${{ matrix.artifact }}-gui-portable.exe

  hololens-core-tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify generated stream contracts
        run: python tools/generate_stream_contracts.py --check

      - name: Run platform-neutral HoloLens tests
        run: dotnet run --project hololens-gaze-lsl/Tests/HoloLensCore.Tests.csproj --configuration Release

  release:
    needs: [logic-tests, build, hololens-core-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source for release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag provenance
        shell: bash
        run: bash .github/scripts/verify-release-provenance.sh

      - name: Verify tag matches CMake project version
        shell: bash
        run: bash .github/scripts/verify-release-version.sh

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vicon-lsl-bridge-linux-x64
          path: artifacts/vicon-lsl-bridge-linux-x64

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vicon-lsl-bridge-windows-x64
          path: artifacts/vicon-lsl-bridge-windows-x64

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vicon-lsl-bridge-macos-arm64
          path: artifacts/vicon-lsl-bridge-macos-arm64

      - name: Assemble versioned release assets
        shell: bash
        run: bash .github/scripts/assemble-release-assets.sh

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
